[package]
name = "anycode-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[lib]
name = "anycode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anycode-store = { path = "../../../crates/anycode-store" }

# Standalone workspace: this crate is driven by the pnpm/Tauri toolchain, not `cargo test
# --workspace` at the repo root, so it does not join crates/*'s workspace.
[workspace]
